apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// apply plugin: "com.google.gms.google-services" // TODO: Thêm lại sau khi tạo Firebase project

react {
    autolinkLibrariesWithApp()
}

// react-native-vector-icons: copy font files vào Android assets
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// Đọc keystore từ file properties (bảo mật hơn hardcode)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vinhan"
    defaultConfig {
        applicationId "com.vinhan.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(keystoreProperties['STORE_FILE'] ?: 'vinhan-release.keystore')
            storePassword keystoreProperties['STORE_PASSWORD'] ?: ''
            keyAlias keystoreProperties['KEY_ALIAS'] ?: ''
            keyPassword keystoreProperties['KEY_PASSWORD'] ?: ''
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.vinhan.dev"
            resValue "string", "app_name", "VinhAn-dev"
            versionCode 1
            versionName "1.0.0"
        }
        prod {
            dimension "environment"
            applicationId "com.vinhan.app"
            resValue "string", "app_name", "VinhAn"
            versionCode 1
            versionName "1.0.0"
        }
    }
    
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavor = variant.flavorName
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            outputFileName = "VinhAn-${flavor}-${buildType}-v${versionName}.apk"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
